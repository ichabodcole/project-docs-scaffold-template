<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Work board</title>
    <!-- No icon: without this the browser asks for /favicon.ico. -->
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
    <!-- board.ts registers the component on `alpine:init`, so it comes first. -->
    <script type="module" src="./board.ts"></script>
    <script defer src="./vendor/alpine.min.js"></script>
  </head>

  <body>
    <!-- The icons, inline: nothing is fetched from outside this server. Paths
         from Lucide (ISC licence): activity, inbox, list-checks, columns-3,
         layers, chevron-down, chevron-up, x. -->
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-activity" viewBox="0 0 24 24">
        <path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2" />
      </symbol>
      <symbol id="i-inbox" viewBox="0 0 24 24">
        <polyline points="22 12 16 12 14 15 10 15 8 12 2 12" />
        <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" />
      </symbol>
      <symbol id="i-list-checks" viewBox="0 0 24 24">
        <path d="m3 17 2 2 4-4" />
        <path d="m3 7 2 2 4-4" />
        <path d="M13 6h8" />
        <path d="M13 12h8" />
        <path d="M13 18h8" />
      </symbol>
      <symbol id="i-columns" viewBox="0 0 24 24">
        <rect width="18" height="18" x="3" y="3" rx="2" />
        <path d="M9 3v18" />
        <path d="M15 3v18" />
      </symbol>
      <symbol id="i-layers" viewBox="0 0 24 24">
        <path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z" />
        <path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12" />
        <path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17" />
      </symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></symbol>
      <symbol id="i-chevron-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6" /></symbol>
      <symbol id="i-x" viewBox="0 0 24 24">
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </symbol>
    </svg>

    <!-- Three regions at most: nav · centre · inspector. The centre is a pinned
         band over one scroller; the inspector is the other scroller. Nothing
         floats but the Snooze menu and the cycle chooser. -->
    <div x-data="board" x-cloak class="shell" @keydown.window="keydown($event)">
      <!-- Nav: where you are. The Inbox count is the only number. -->
      <aside class="nav" data-nav>
        <div class="nav-head">
          <div class="nav-name">Work board</div>
          <div class="nav-project mono" x-text="project"></div>
        </div>
        <nav class="nav-list">
          <button class="nav-item" :class="vm.nav === 'now' && 'is-on'" :aria-current="vm.nav === 'now' ? 'page' : false" data-nav-item="now" @click="go('now')">
            <svg class="icon"><use href="#i-activity" /></svg><span>Now</span>
          </button>
          <button class="nav-item" :class="vm.nav === 'inbox' && 'is-on'" :aria-current="vm.nav === 'inbox' ? 'page' : false" data-nav-item="inbox" @click="go('inbox')">
            <svg class="icon"><use href="#i-inbox" /></svg><span>Inbox</span>
            <span class="count nav-count" data-inbox-count x-show="vm.inboxCount" x-text="vm.inboxCount"></span>
          </button>
          <button class="nav-item" :class="vm.nav === 'triage' && 'is-on'" :aria-current="vm.nav === 'triage' ? 'page' : false" data-nav-item="triage" @click="go('triage')">
            <svg class="icon"><use href="#i-list-checks" /></svg><span>Triage</span>
          </button>
          <button class="nav-item" :class="vm.nav === 'cycle' && 'is-on'" :aria-current="vm.nav === 'cycle' ? 'page' : false" data-nav-item="cycle" @click="go('cycle')">
            <svg class="icon"><use href="#i-columns" /></svg><span>Cycle</span>
          </button>
          <button class="nav-item" :class="vm.nav === 'feature' && 'is-on'" :aria-current="vm.nav === 'feature' ? 'page' : false" data-nav-item="feature" @click="go('feature')">
            <svg class="icon"><use href="#i-layers" /></svg><span>Feature</span>
          </button>
        </nav>
      </aside>

      <!-- Centre: one column. A pinned band, then one list. -->
      <main class="centre" data-centre>
        <!-- Nothing to draw: the project's CLI is too old, or no snapshot has arrived. -->
        <div x-show="problem && (vm.blocked || !ready)" class="stop" data-problem>
          <p class="stop-message" x-text="problem ? problem.message : ''"></p>
          <p class="stop-hint" x-show="problem && problem.hint" x-text="problem ? problem.hint : ''"></p>
        </div>

        <!-- The band: page-level state. Every line is one line, so it keeps its
             height and its left edge when the inspector opens. -->
        <div x-show="ready && !vm.blocked" class="band" data-band>
          <div :class="vm.inspecting ? '' : 'cap'">
            <div class="band-line">
              <button x-show="vm.band.box && vm.band.box.back" class="btn-text" data-back @click="back()" x-text="vm.band.box ? '← ' + vm.band.box.back : ''"></button>
              <h1 x-show="!vm.band.box" class="page-title" data-page-title x-text="vm.band.title"></h1>
              <span x-show="vm.view === 'triage'" class="count" x-text="vm.band.count"></span>
              <div x-show="vm.view === 'now'" class="segs">
                <button class="seg seg-tight" :class="vm.band.nowBy === 'cycle' && 'is-on'" :aria-pressed="vm.band.nowBy === 'cycle'" @click="setNowBy('cycle')">by cycle</button>
                <button class="seg seg-tight" :class="vm.band.nowBy === 'feature' && 'is-on'" :aria-pressed="vm.band.nowBy === 'feature'" @click="setNowBy('feature')">by feature</button>
              </div>
              <span x-show="vm.band.box" class="dot" :class="vm.band.box ? 'lc-' + vm.band.box.lifecycle : ''" :title="vm.band.box ? vm.band.box.lifecycle : ''"></span>
              <h1 x-show="vm.view === 'featurePage'" class="page-title truncate" data-box-title x-text="vm.band.box ? vm.band.box.title : ''"></h1>
              <!-- the cycle's title is the cycle switcher -->
              <div x-show="vm.view === 'cycle'" class="chooser" @click.outside="closeMenu()">
                <button class="page-title chooser-title" data-cycle-title @click="toggleMenu()" :aria-expanded="vm.band.menu" title="Choose a cycle">
                  <span class="truncate" x-text="vm.band.box ? vm.band.box.title : ''"></span>
                  <svg class="icon icon-muted"><use href="#i-chevron-down" /></svg>
                </button>
                <div x-show="vm.band.menu" class="menu menu-wide" data-cycle-menu>
                  <template x-for="c in vm.band.cycles" :key="c.slug">
                    <button class="menu-item menu-cycle" :class="c.on && 'is-on'" :data-cycle="c.lifecycle" @click="setCycle(c.slug)">
                      <span class="dot" :class="'lc-' + c.lifecycle"></span>
                      <span class="menu-cycle-state" x-text="c.lifecycle"></span>
                      <span class="truncate" x-text="c.title"></span>
                    </button>
                  </template>
                </div>
              </div>
            </div>
            <div x-show="vm.band.box" class="band-sub">
              <div class="bar bar-fixed">
                <template x-for="s in vm.band.box ? vm.band.box.bar : []" :key="s.lifecycle">
                  <div :class="'lc-' + s.lifecycle" :style="'width:' + s.pct + '%'" :title="s.n + ' ' + s.lifecycle"></div>
                </template>
              </div>
              <span class="faint truncate" data-summary x-text="vm.band.box ? vm.band.box.summary : ''"></span>
            </div>
            <div x-show="vm.band.box && vm.band.box.note" class="faint truncate" :title="vm.band.box ? vm.band.box.note : ''">
              <span x-text="vm.band.box ? vm.band.box.noteLabel : ''"></span><span x-text="vm.band.box ? vm.band.box.note : ''"></span>
            </div>
            <div x-show="vm.view === 'cycle'" class="tabs" role="tablist" aria-label="This cycle's lists">
              <button class="tab" role="tab" :aria-selected="vm.band.tab === 'in'" :class="vm.band.tab === 'in' && 'is-on'" data-tab="in" @click="setTab('in')">In this cycle<span class="count" x-text="vm.band.inCount || ''"></span></button>
              <button class="tab" role="tab" :aria-selected="vm.band.tab === 'cand'" :class="vm.band.tab === 'cand' && 'is-on'" data-tab="cand" @click="setTab('cand')">Candidates<span class="count" x-text="vm.band.candCount || ''"></span></button>
            </div>
            <div x-show="vm.view !== 'cycle'" class="band-foot"></div>
          </div>
        </div>

        <div x-show="ready && !vm.blocked" class="scroll pad" data-scroll>
          <div :class="vm.inspecting ? '' : 'cap'">
            <!-- ================= NOW: only about work ================= -->
            <div x-show="vm.view === 'now'" class="page page-wide">
              <template x-if="vm.now.cycle">
                <div class="now-cycle" data-now-cycle>
                  <div class="head">Active cycle</div>
                  <button class="now-cycle-title" data-now-open-cycle @click="openCycle(vm.now.cycle.slug)" x-text="vm.now.cycle.title"></button>
                  <div class="band-sub">
                    <div class="bar bar-fixed">
                      <template x-for="s in vm.now.cycle.bar" :key="s.lifecycle">
                        <div :class="'lc-' + s.lifecycle" :style="'width:' + s.pct + '%'" :title="s.n + ' ' + s.lifecycle"></div>
                      </template>
                    </div>
                    <span class="faint" x-text="vm.now.cycle.summary"></span>
                  </div>
                </div>
              </template>
              <div x-show="vm.now.empty" class="muted">Nothing is active or in review.</div>
              <template x-for="g in vm.now.groups" :key="g.key">
                <div :data-now-group="g.key">
                  <div class="head"><span x-text="g.label"></span><span class="count" x-text="g.rows.length"></span></div>
                  <div class="list">
                    <template x-for="r in g.rows" :key="r.key">
                      <div class="row" :class="r.on && 'is-on'" :data-key="r.key" @click="pick(r.key)">
                        <div class="grow">
                          <button class="row-title" data-focus x-text="r.title"></button>
                          <div class="meta">
                            <span class="meta-text">
                              <template x-for="(p, n) in r.meta.parts" :key="n">
                                <span :class="p.dot && 'lc'" :title="p.title"><span x-show="p.dot" class="dot" :class="'lc-' + p.dot"></span><span x-text="p.text"></span></span>
                              </template>
                            </span>
                            <template x-for="p in r.meta.pills" :key="p.kind"><span class="pill" :class="'pill-' + p.kind" x-text="p.text"></span></template>
                          </div>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>

            <!-- ================= INBOX: two groups, one behaviour per row ================= -->
            <div x-show="vm.view === 'inbox'" class="page page-wide">
              <div x-show="vm.inbox.empty" class="muted">Nothing needs you right now.</div>
              <template x-for="g in vm.inbox.groups" :key="g.id">
                <div :data-inbox-group="g.id">
                  <div class="head"><span x-text="g.label"></span><span class="count" x-text="g.rows.length"></span></div>
                  <div class="list">
                    <template x-for="a in g.rows" :key="a.id">
                      <div class="row" :class="{ 'is-on': a.on, 'is-static': !a.does }" :data-key="a.key" :data-attn="a.id" @click="attend(a.id)">
                        <div class="grow">
                          <div class="row-label">
                            <span class="dot dot-alert" x-show="a.alert"></span>
                            <span class="row-title truncate" x-text="a.label" :title="a.label"></span>
                            <span class="count" x-text="a.n"></span>
                          </div>
                          <div class="faint truncate" x-text="a.text" :title="a.tip"></div>
                        </div>
                        <div class="floater on-hover" :class="a.menu && 'is-open'" @click.stop @click.outside="closeSnooze(a.id)">
                          <button class="btn-text" data-snooze @click="toggleSnooze(a.id)" :aria-expanded="a.menu">Snooze</button>
                          <div x-show="a.menu" class="menu menu-right" :class="g.id === 'housekeeping' && 'menu-up'" data-snooze-menu>
                            <template x-for="c in snoozeChoices" :key="c.id">
                              <button class="menu-item" data-snooze-choice @click="snooze(a.id, c.id)" x-text="c.label"></button>
                            </template>
                          </div>
                        </div>
                        <button x-show="a.does" class="btn-text btn-does" data-does data-focus @click.stop="attend(a.id)" x-text="a.does"></button>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
              <div x-show="vm.inbox.snoozed.length" data-snoozed>
                <button class="head head-button" data-snoozed-toggle @click="snoozedOpen = !snoozedOpen" :aria-expanded="snoozedOpen">
                  <span>Snoozed</span><span class="count" x-text="vm.inbox.snoozed.length"></span><span class="count" x-text="snoozedOpen ? 'Hide' : 'Show'"></span>
                </button>
                <div x-show="snoozedOpen" class="list">
                  <template x-for="a in vm.inbox.snoozed" :key="a.id">
                    <div class="line is-static">
                      <div class="grow line-text truncate"><span x-text="a.label"></span> <span class="count" x-text="a.n"></span></div>
                      <span class="count" x-text="a.note"></span>
                      <button class="btn-text btn-strong" data-wake @click="wake(a.id)">Wake</button>
                    </div>
                  </template>
                </div>
              </div>
            </div>

            <!-- ================= TRIAGE: the queue; the item opens in the inspector ================= -->
            <div x-show="vm.view === 'triage'" class="page">
              <div x-show="!vm.triage.rows.length" class="muted">Triage is empty.</div>
              <div x-show="vm.triage.rows.length" data-queue>
                <div class="head"><span>Waiting</span><span class="count" x-text="vm.triage.rows.length"></span></div>
                <div class="list">
                  <template x-for="r in vm.triage.rows" :key="r.key">
                    <div class="line" :class="r.on && 'is-on'" :data-key="r.key" @click="pick(r.key)">
                      <button class="row-title truncate grow" data-focus x-text="r.title"></button>
                      <div class="meta meta-kind">
                        <span class="meta-text meta-nowrap"><span x-show="r.kind" x-text="r.kind"></span><span x-show="r.source" x-text="r.source"></span></span>
                      </div>
                      <span class="count line-date" x-text="r.filed"></span>
                    </div>
                  </template>
                </div>
              </div>
            </div>

            <!-- ================= A CONTAINER'S LIST: a cycle (tab 1) or a feature ================= -->
            <div x-show="(vm.view === 'cycle' && vm.band.tab === 'in') || vm.view === 'featurePage'" class="page" data-box-list>
              <div x-show="!vm.box.groups.length" class="muted" x-text="vm.box.empty"></div>
              <template x-for="g in vm.box.groups" :key="g.id">
                <div :data-group="g.id">
                  <div x-show="!g.fold" class="head">
                    <span class="dot" x-show="g.id !== 'added'" :class="'lc-' + g.id"></span><span x-text="g.label"></span><span class="count" x-text="g.rows.length"></span>
                  </div>
                  <button x-show="g.fold" class="head head-button" data-done @click="toggleDone()" :aria-expanded="g.open">
                    <span class="dot" :class="'lc-' + g.id"></span><span x-text="g.label"></span><span class="count" x-text="g.rows.length"></span><span class="count" x-text="g.open ? 'Hide' : 'Show'"></span>
                  </button>
                  <div x-show="g.open" class="list">
                    <template x-for="r in g.rows" :key="r.key">
                      <div class="row" :class="r.on && 'is-on'" :data-key="r.key" @click="pick(r.key)">
                        <div class="grow">
                          <button class="row-title" data-focus x-text="r.title"></button>
                          <div class="meta">
                            <span class="meta-text">
                              <template x-for="(p, n) in r.meta.parts" :key="n">
                                <span :class="p.dot && 'lc'" :title="p.title"><span x-show="p.dot" class="dot" :class="'lc-' + p.dot"></span><span x-text="p.text"></span></span>
                              </template>
                            </span>
                            <template x-for="p in r.meta.pills" :key="p.kind"><span class="pill" :class="'pill-' + p.kind" x-text="p.text"></span></template>
                          </div>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>

            <!-- ================= CANDIDATES (tab 2): one-line rows, the filter on one row ================= -->
            <div x-show="vm.view === 'cycle' && vm.band.tab === 'cand'" class="page-flush" data-candidates>
              <div class="filter" data-filter>
                <input class="input grow" placeholder="filter" :value="vm.cand.q" @input="setCand('q', $event.target.value)" aria-label="Filter candidates" />
                <select class="select" @change="setCand('lifecycle', $event.target.value)" aria-label="Lifecycle">
                  <option value="all" :selected="vm.cand.lifecycle === 'all'">any state</option>
                  <option value="ready" :selected="vm.cand.lifecycle === 'ready'">ready</option>
                  <option value="backlog" :selected="vm.cand.lifecycle === 'backlog'">backlog</option>
                </select>
                <select class="select select-feature" @change="setCand('feature', $event.target.value)" aria-label="Feature">
                  <option value="all" :selected="vm.cand.feature === 'all'">any feature</option>
                  <option value="none" :selected="vm.cand.feature === 'none'">no feature</option>
                  <template x-for="f in vm.cand.features" :key="f"><option :value="f" :selected="vm.cand.feature === f" x-text="f"></option></template>
                </select>
              </div>
              <div x-show="!vm.cand.rows.length" class="muted empty">No candidate matches.</div>
              <div class="list list-plain">
                <template x-for="r in vm.cand.rows" :key="r.key">
                  <div class="line" :class="r.on && 'is-on'" :data-key="r.key" @click="pick(r.key)">
                    <button class="row-title truncate grow" data-focus x-text="r.title"></button>
                    <div class="meta meta-cand">
                      <span class="meta-text meta-nowrap">
                        <template x-for="(p, n) in r.meta.parts" :key="n">
                          <span :class="p.dot && 'lc'" :title="p.title"><span x-show="p.dot" class="dot" :class="'lc-' + p.dot"></span><span x-text="p.text"></span></span>
                        </template>
                      </span>
                      <template x-for="p in r.meta.pills" :key="p.kind"><span class="pill" :class="'pill-' + p.kind" x-text="p.text"></span></template>
                    </div>
                  </div>
                </template>
              </div>
            </div>

            <!-- ================= FEATURES: a list of containers; clicking one drills in ================= -->
            <div x-show="vm.view === 'feature'" class="page" data-features>
              <div x-show="!vm.features.length" class="muted">No current feature.</div>
              <div x-show="vm.features.length" class="list">
                <template x-for="f in vm.features" :key="f.slug">
                  <div class="row" :data-feature="f.slug" @click="openFeature(f.slug)">
                    <div class="grow">
                      <button class="row-title" x-text="f.title"></button>
                      <div class="meta">
                        <span class="meta-text">
                          <span class="lc"><span class="dot" :class="'lc-' + f.lifecycle"></span><span x-text="f.lifecycle"></span></span>
                          <span x-text="f.count"></span>
                          <span x-show="f.finished" x-text="f.finished"></span>
                          <span x-show="f.draft">draft</span>
                        </span>
                      </div>
                    </div>
                    <div class="bar bar-fixed">
                      <template x-for="s in f.bar" :key="s.lifecycle">
                        <div :class="'lc-' + s.lifecycle" :style="'width:' + s.pct + '%'"></div>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </div>

        <!-- One line under the list: a line to copy, or why the board is not
             updating. The command a write ran, and its Undo, will sit here. -->
        <div x-show="problem && !vm.blocked && ready" class="ran" data-stale aria-live="polite">
          <span class="ran-label">not updating:</span>
          <span class="ran-text truncate" x-text="problem ? problem.message : ''" :title="problem ? problem.message : ''"></span>
        </div>
        <div x-show="last" class="ran" data-ran>
          <span class="ran-label" x-text="last ? last.label : ''"></span>
          <span class="ran-text mono truncate" data-ran-text x-text="last ? last.text : ''"></span>
        </div>
      </main>

      <!-- Inspector: the selected item. A flex sibling of the centre, so it
           pushes and never covers. -->
      <aside x-show="vm.inspector" class="inspector" data-inspector aria-label="Selected item">
        <template x-if="vm.inspector">
          <div class="scroll inspector-body" data-inspector-body>
            <div class="stack">
              <div class="inspector-bar">
                <span class="count inspector-pos" data-pos x-text="vm.inspector.position"></span>
                <button class="btn-icon" data-prev :disabled="vm.inspector.first" @click="step(-1)" aria-label="Previous" title="Previous (K or ↑)">
                  <svg class="icon"><use href="#i-chevron-up" /></svg>
                </button>
                <button class="btn-icon" data-next :disabled="vm.inspector.last" @click="step(1)" aria-label="Next" title="Next (J or ↓)">
                  <svg class="icon"><use href="#i-chevron-down" /></svg>
                </button>
                <button class="btn-icon" data-close @click="close()" aria-label="Close" title="Close (Esc)">
                  <svg class="icon"><use href="#i-x" /></svg>
                </button>
              </div>
              <div class="stack-tight">
                <div class="item-title" data-title x-text="vm.inspector.title"></div>
                <div class="meta">
                  <span class="meta-text">
                    <template x-for="(p, n) in vm.inspector.meta.parts" :key="n">
                      <span :class="p.dot && 'lc'" :title="p.title"><span x-show="p.dot" class="dot" :class="'lc-' + p.dot"></span><span x-text="p.text"></span></span>
                    </template>
                  </span>
                  <template x-for="p in vm.inspector.meta.pills" :key="p.kind"><span class="pill" :class="'pill-' + p.kind" x-text="p.text"></span></template>
                </div>
              </div>
              <p class="description" x-show="vm.inspector.description" x-text="vm.inspector.description"></p>

              <dl class="fields rule-top">
                <template x-for="f in vm.inspector.fields" :key="f.label">
                  <div class="field">
                    <dt x-text="f.label"></dt>
                    <dd :class="f.mono && 'mono'">
                      <template x-for="(t, n) in f.text" :key="n"><span><span x-text="t"></span><wbr /></span></template>
                      <template x-for="(b, n) in f.blockers" :key="n">
                        <span class="lc blocker">
                          <span class="dot" :class="'lc-' + b.dot"></span>
                          <span>
                            <template x-for="(t, m) in b.name" :key="m"><span><span x-text="t"></span><wbr /></span></template>
                            <span class="blocker-state" x-text="b.lifecycle"></span>
                          </span>
                        </span>
                      </template>
                    </dd>
                  </div>
                </template>
              </dl>
              <div class="actions">
                <button class="btn-text" data-copy @click="copy()" :title="vm.inspector.tip" x-text="copied ? 'Copied' : 'Copy path'"></button>
                <button class="btn-text" data-handoff @click="handoff()">Open in Scriptorium</button>
              </div>
            </div>
          </div>
        </template>
      </aside>
    </div>
  </body>
</html>
